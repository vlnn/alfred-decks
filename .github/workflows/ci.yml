name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run tests
        run: uv run --with pytest pytest
      - name: Lint workflow definition
        if: runner.os == 'macOS'
        run: plutil -lint info.plist

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 .github/set_version.py "${GITHUB_REF_NAME#v}"
      - name: Package workflow
        run: ./package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Decks.alfredworkflow
          path: Decks.alfredworkflow
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Decks.alfredworkflow --generate-notes
